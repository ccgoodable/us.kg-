name: digitalplat-renew

on:
  schedule:
    # 每周一 UTC 03:17 运行一次 (可根据需要调整时间)
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 列出所有账号域名 (仅确认连接、不修改)
        run: node scripts/list-domains.mjs
        env:
          DIGITALPLAT_API_KEY: ${{ secrets.DIGITALPLAT_API_KEY }}
          DIGITALPLAT_API_KEYS: ${{ secrets.DIGITALPLAT_API_KEYS }}
          DIGITALPLAT_ACCOUNTS: ${{ secrets.DIGITALPLAT_ACCOUNTS }}

      - name: 自动续期到期域名 (内置规则:到期前120天内、免费域名免费续一年)
        run: node scripts/renew.mjs
        env:
          # 支持单账号或多账号 Secret (多账号可用换行/逗号隔开，或带备注 如 "主号:dp_live_xxx")
          DIGITALPLAT_API_KEY: ${{ secrets.DIGITALPLAT_API_KEY }}
          DIGITALPLAT_API_KEYS: ${{ secrets.DIGITALPLAT_API_KEYS }}
          DIGITALPLAT_ACCOUNTS: ${{ secrets.DIGITALPLAT_ACCOUNTS }}
          # 可选参数覆盖 (默认留空即用脚本内置推荐值):
          # RENEW_THRESHOLD_DAYS: '120'
          # RENEW_YEARS: '1'
          # RENEW_PAYMENT_METHOD: ''
          # RENEW_PAYMENT_FREE: 'free'
          # RENEW_PAYMENT_PAID: 'credits'
          # RENEW_DELAY_MS: '300'
          # DRY_RUN: 'false'
